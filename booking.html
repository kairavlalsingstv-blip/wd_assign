<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CinePass - Ticket Booking</title>
    <link rel="stylesheet" href="css/style.css"> 
</head> 
<body>
    <header>
        <nav>
            <a href="index.html" class="logo">🎬 CinePass</a>
            <ul class="nav-links">
                <li><a href="index.html">Movies</a></li>
                <li><a href="recommend.html">Recommendations</a></li>
                <li><a href="watchlist.html">Watchlist</a></li>
                <li><a href="register.html">Register</a></li>
                <li><a href="booking.html" class="active">Book Tickets</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Book Your Movie Tickets</h1>
        <form id="bookingForm">
            <div class="form-group">
                <label for="movieSelect">Select Movie:</label>
                <select id="movieSelect" required>
                    <option value="">-- Choose a Movie --</option>
                    <option value="Cyber Odyssey">Cyber Odyssey</option>
                    <option value="Midnight Heist">Midnight Heist</option>
                    <option value="The Last Laugh">The Last Laugh</option>
                    <option value="Whispers in the Dark">Whispers in the Dark</option>
                    <option value="Beyond the Stars">Beyond the Stars</option>
                    <option value="Echoes of Time">Echoes of Time</option>
                </select>
            </div>

            <div class="form-group">
                <label for="adultQty">Adult Tickets ($18 each):</label>
                <input type="number" id="adultQty" min="0" value="0">
            </div>

            <div class="form-group">
                <label for="childQty">Child Tickets ($12 each):</label>
                <input type="number" id="childQty" min="0" value="0">
            </div>

            <div class="form-group">
                <label for="studentQty">Student Tickets ($14 each):</label>
                <input type="number" id="studentQty" min="0" value="0">
            </div>

            <h3>Total Cost: <span id="totalCost">$0.00</span></h3>
            <button type="submit" class="btn" style="width: 100%; margin-top: 1rem;">Confirm Booking</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 CinePass Movie Discovery.</p>
    </footer>

    <script src="js/script.js"></script> 
</body> 
</html>
