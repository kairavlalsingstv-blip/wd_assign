<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CinePass - User Registration</title>
    <link rel="stylesheet" href="css/style.css"> 
</head>
 <body>
    <header>
        <nav>
            <a href="index.html" class="logo">🎬 CinePass</a>
            <ul class="nav-links">
                <li><a href="index.html">Movies</a></li>
                <li><a href="recommend.html">Recommendations</a></li>
                <li><a href="watchlist.html">Watchlist</a></li>
                <li><a href="register.html" class="active">Register</a></li>
                <li><a href="booking.html">Book Tickets</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Create Account</h1>
        <form id="registrationForm">
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" required>
                <div class="error-msg"></div>
            </div>

            <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="email" id="email" required>
                <div class="error-msg"></div>
            </div>

            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" required>
                <div class="error-msg"></div>
            </div>

            <button type="submit" class="btn" style="width: 100%;">Register Now</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 CinePass Movie Discovery.</p>
    </footer>

    <script src="js/script.js"></script> 
</body>
</html>
